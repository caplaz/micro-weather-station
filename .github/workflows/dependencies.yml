name: Dependency Updates

on:
  schedule:
    # Run every Monday at 10:00 AM UTC
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Check for Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Home Assistant Updates
        id: ha_check
        run: |
          # Get latest Home Assistant version
          LATEST_HA=$(curl -s https://api.github.com/repos/home-assistant/core/releases/latest | jq -r .tag_name)
          echo "latest_ha=$LATEST_HA" >> $GITHUB_OUTPUT
          echo "Latest Home Assistant version: $LATEST_HA"

          # Python floor of that release - the latest Home Assistant releases
          # require a newer Python than the one this repository tests on
          LATEST_HA_PYTHON=$(curl -s "https://pypi.org/pypi/homeassistant/$LATEST_HA/json" | jq -r '.info.requires_python // "unknown"')
          echo "Latest Home Assistant requires Python: $LATEST_HA_PYTHON"
          echo "latest_ha_python=$LATEST_HA_PYTHON" >> $GITHUB_OUTPUT

          # Minimum supported version is declared in hacs.json, not manifest.json
          MIN_HA_VERSION=$(python -c "
          import json
          with open('hacs.json') as f:
              hacs = json.load(f)
          print(hacs.get('homeassistant', 'Not specified'))
          ")
          echo "Minimum supported HA version: $MIN_HA_VERSION"
          echo "min_ha=$MIN_HA_VERSION" >> $GITHUB_OUTPUT

          # Version the CI test matrix actually exercises (matrix list plus the
          # versions pinned in the include block)
          TESTED_HA=$(grep -oE 'home-assistant-version: *(\[[^]]*\]|"[0-9.]+")' .github/workflows/ci.yml \
            | grep -oE '[0-9]{4}\.[0-9]+\.[0-9]+' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "Tested HA version(s): $TESTED_HA"
          echo "tested_ha=$TESTED_HA" >> $GITHUB_OUTPUT

          # Python versions the test matrix uses
          TESTED_PYTHON=$(grep -oE 'python-version: *(\[[^]]*\]|"[0-9.]+")' .github/workflows/ci.yml \
            | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "Tested Python version(s): $TESTED_PYTHON"
          echo "tested_python=$TESTED_PYTHON" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: update_needed
        run: |
          LATEST="${{ steps.ha_check.outputs.latest_ha }}"
          TESTED="${{ steps.ha_check.outputs.tested_ha }}"
          case ",$TESTED," in
            *",$LATEST,"*)
              echo "update_needed=false" >> $GITHUB_OUTPUT
              echo "Home Assistant $LATEST is already in the CI test matrix"
              ;;
            *)
              echo "update_needed=true" >> $GITHUB_OUTPUT
              echo "Home Assistant update available"
              ;;
          esac

      - name: Create Issue for Updates
        if: steps.update_needed.outputs.update_needed == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['dependencies', 'enhancement'],
              state: 'open'
            });

            const existingIssue = issues.find(issue =>
              issue.title.includes('Dependency Update')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Dependency Update Available',
                body: `## Dependency Updates Available

                ### Home Assistant
                - **Latest release**: ${{ steps.ha_check.outputs.latest_ha }}
                - **Tested in CI**: ${{ steps.ha_check.outputs.tested_ha }}
                - **Minimum supported**: ${{ steps.ha_check.outputs.min_ha }}
                - **Latest release requires**: Python ${{ steps.ha_check.outputs.latest_ha_python }}
                - **CI tests on Python**: ${{ steps.ha_check.outputs.tested_python }}

                ### Actions Required
                - [ ] Test compatibility with the latest Home Assistant version
                - [ ] Add it to the CI test matrix in \`.github/workflows/ci.yml\` if compatible
                - [ ] If it needs a newer Python than the matrix uses, add a matching Python leg
                - [ ] Update \`hacs.json\` if the minimum supported version changes
                - [ ] Update documentation if needed
                - [ ] Create new release if necessary

                This issue was automatically created by the dependency update workflow.`,
                labels: ['dependencies', 'enhancement', 'automated']
              });
            }

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
